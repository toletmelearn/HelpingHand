<!DOCTYPE html>
<html>
<head>
    <title>Test Exam AJAX</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .error { background: #ffcccc; }
        .success { background: #ccffcc; }
    </style>
</head>
<body>
    <h1>Test Exam Details AJAX</h1>
    
    <label>Enter Exam ID:</label>
    <input type="number" id="examId" value="1" />
    <button onclick="testAjax()">Test AJAX Call</button>
    
    <div id="results"></div>
    
    <script>
        function testAjax() {
            const examId = document.getElementById('examId').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<div class="result">Loading...</div>';
            
            // Test URL
            const url = `/admin/exams/${examId}/details`;
            
            resultsDiv.innerHTML += `<div class="result">Testing URL: ${url}</div>`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin'
            })
            .then(response => {
                resultsDiv.innerHTML += `<div class="result ${response.ok ? 'success' : 'error'}">
                    Status: ${response.status} ${response.statusText}
                </div>`;
                
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                
                return response.json();
            })
            .then(data => {
                resultsDiv.innerHTML += `<div class="result success">
                    <h3>Success! Data Received:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>`;
            })
            .catch(error => {
                resultsDiv.innerHTML += `<div class="result error">
                    <h3>Error:</h3>
                    <p>${error.message}</p>
                </div>`;
            });
        }
    </script>
</body>
</html>
